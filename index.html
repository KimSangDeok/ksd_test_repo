<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공공임대 후보 단지 지도 (네이버지도)</title>
<style>
  :root{--bg:#f3f5f8;--surface:#fff;--fg:#1b2330;--muted:#5f6b7a;--line:#dde3ea;--accent:#1f5fbf;--ok:#1d8a4e;--warn:#b46a00;--bad:#c23c3c;--kook:#c97a00}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--fg);background:var(--bg);display:flex;flex-direction:column}
  header{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--line);font-size:13.5px}
  header h1{font-size:16px;margin:0 8px 0 0}
  header label{display:inline-flex;align-items:center;gap:5px;cursor:pointer;white-space:nowrap}
  .dot{display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
  .sq{display:inline-block;width:12px;height:12px;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
  #wrap{flex:1;display:flex;min-height:0}
  #map{flex:1;min-height:60vh}
  #list{width:330px;max-width:45vw;overflow:auto;background:var(--surface);border-left:1px solid var(--line);font-size:13px}
  #list .it{padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer}
  #list .it:hover{background:#eef3fb}
  #list .it b{display:block}
  #list .it small{color:var(--muted)}
  #msg{display:none;padding:14px 16px;background:#fff4e5;border-bottom:1px solid #f1d2a0;font-size:13.5px;line-height:1.6}
  #msg.show{display:block}
  .iw{font:13px/1.55 "Noto Sans KR",system-ui,sans-serif;padding:10px 12px;min-width:220px;max-width:300px}
  .iw b{font-size:14px}
  .iw .k{color:var(--muted)}
  .iw a{color:var(--accent)}
  .mk{width:16px;height:16px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
  .mk.sm{width:11px;height:11px}
  .mk.sq{border-radius:2px}
  .mk.home{width:0;height:0;border:0;box-shadow:none;font-size:22px;line-height:1}
  @media (max-width:760px){ #wrap{flex-direction:column} #list{width:auto;max-width:none;max-height:38vh;border-left:0;border-top:1px solid var(--line)} }
</style>
</head>

<header>
  <h1>공공임대 후보 단지</h1>
  <label><input type="checkbox" data-cat="pri" checked> <span class="dot" style="background:var(--ok)"></span> 행복주택 · 우선 1순위 가능</label>

  <label><input type="checkbox" data-cat="small"> <span class="dot" style="background:#8a94a3"></span> 행복주택 27~35㎡</label>
  <label><input type="checkbox" data-cat="kook" checked> <span class="sq" style="background:var(--kook)"></span> 국민임대 지구</label>
  <span id="status" style="color:var(--muted)"></span>
</header>
<div id="msg"></div>
<div id="wrap">
  <div id="map"></div>
  <div id="list"></div>
</div>

(function(){
  var s = document.createElement('script');
  s.src = 'https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=' + encodeURIComponent(NCP_KEY_ID) + '&submodules=geocoder';
  s.onload = init; s.onerror = function(){ fail('지도 스크립트를 못 불러왔습니다. 인터넷 연결과 ncpKeyId 값을 확인하세요.'); };
  document.head.appendChild(s);
})();

function fail(text){ var m = document.getElementById('msg'); m.innerHTML = text; m.classList.add('show'); }
window.navermap_authFailure = function(){
  fail('<b>네이버지도 인증 실패.</b> 순서대로 확인: ① 이 페이지를 <code>file://</code>로 연 건 아닌지 (반드시 <code>http://localhost:포트/…</code>로) ② 콘솔 Application의 Web 서비스 URL에 <code>http://localhost</code>가 포트·경로 없이 등록돼 있는지 ③ Application이 AI·NAVER API가 아니라 <b>Application Services &gt; Maps</b> 아래에 있고 Dynamic Map이 체크돼 있는지 ④ Client ID를 그대로 붙여넣었는지 (파라미터 이름은 ncpKeyId).');
};

var map, markers = [], infow, cache = {};
try { cache = JSON.parse(localStorage.getItem('geocache-v1') || '{}'); } catch(e) {}
function saveCache(){ try { localStorage.setItem('geocache-v1', JSON.stringify(cache)); } catch(e) {} }

function geocode(addr, cb){
  if (!addr) return cb(null);
  if (cache[addr]) return cb(cache[addr]);
  naver.maps.Service.geocode({ query: addr }, function(status, response){
    if (status !== naver.maps.Service.Status.OK) return cb(null);
    var a = response.v2 && response.v2.addresses;
    if (!a || !a.length) return cb(null);
    var pt = [parseFloat(a[0].y), parseFloat(a[0].x)];
    cache[addr] = pt; saveCache(); cb(pt);
  });
}

function color(p){ return p.cat === 'pri' ? 'var(--ok)' : p.cat === 'big' ? 'var(--accent)' : p.cat === 'kook' ? 'var(--kook)' : '#8a94a3'; }
function iconFor(p, approx){
  var cls = 'mk' + (p.cat === 'small' ? ' sm' : '') + (p.cat === 'kook' ? ' sq' : '');
  var size = p.cat === 'small' ? 11 : 16;
  return { content: '<div class="' + cls + '" style="background:' + color(p) + (approx ? ';opacity:.75;border-style:dashed' : '') + '" title="' + p.name + '"></div>', anchor: new naver.maps.Point(size/2, size/2) };
}
function iwHtml(p, approx){
  var nav = 'https://map.naver.com/p/search/' + encodeURIComponent(p.q || p.name);
  var body = p.kind === '행복주택'
    ? '<div><span class="k">전용</span> ' + p.m2 + '㎡ (' + p.py + ') · <span class="k">공가</span> ' + p.vac + (p.wait ? ' · <span class="k">예비</span> ' + p.wait : '') + '</div>' +
      '<div><span class="k">보증금</span> ' + p.dep + ' · <span class="k">월</span> ' + p.rent + ' <span class="k">(청년 소득있음, ' + p.notice + ')</span></div>'
    : '<div>' + p.info + '</div>';
  return '<div class="iw"><b>' + p.name + '</b> <span class="k">' + p.kind + '</span><br>' + body +
    '<div><span class="k">내 순위</span> ' + p.rank + '</div>' +
    '<div class="k" style="margin-top:4px">' + (p.addr || '') + (approx ? ' · <b style="color:var(--bad)">근사 위치</b>(주소 변환 실패)' : '') + '</div>' +
    '<div style="margin-top:6px"><a href="' + nav + '" target="_blank" rel="noopener">네이버지도에서 열기 · 길찾기</a></div></div>';
}

function init(){
  if (!window.naver || !naver.maps) return;
  map = new naver.maps.Map('map', { center: new naver.maps.LatLng(37.565, 126.93), zoom: 11, zoomControl: true, zoomControlOptions: { position: naver.maps.Position.TOP_LEFT } });
  infow = new naver.maps.InfoWindow({ borderWidth: 0, backgroundColor: 'transparent', disableAnchor: true, pixelOffset: new naver.maps.Point(0, -6) });
  var status = document.getElementById('status');
  var list = document.getElementById('list');

  // 집·회사
  [HOME, WORK].forEach(function(h){
    geocode(h.addr, function(pt){
      var p = pt || h.approx;
      new naver.maps.Marker({ map: map, position: new naver.maps.LatLng(p[0], p[1]), zIndex: 50,
        icon: { content: '<div class="mk home" title="' + h.label + '">' + (h.label === '집' ? '🏠' : '💼') + '</div>', anchor: new naver.maps.Point(11, 22) } });
    });
  });

  // 단지: 순서대로 주소→좌표 (캐시되면 즉시), 실패하면 근사 좌표
  var i = 0, done = 0, approxN = 0;
  function next(){
    if (i >= PLACES.length) { status.textContent = PLACES.length + '곳 표시' + (approxN ? ' (' + approxN + '곳은 근사 위치)' : ''); return; }
    var p = PLACES[i++];
    geocode(p.addr, function(pt){
      var approx = !pt;
      var pos = pt || p.approx;
      if (approx && pos) approxN++;
      if (pos) {
        var mk = new naver.maps.Marker({ map: map, position: new naver.maps.LatLng(pos[0], pos[1]), icon: iconFor(p, approx), zIndex: p.pick ? 20 : 10 });
        mk.__p = p;
        naver.maps.Event.addListener(mk, 'click', function(){ infow.setContent(iwHtml(p, approx)); infow.open(map, mk); });
        markers.push(mk);
        var it = document.createElement('div'); it.className = 'it'; it.dataset.cat = p.cat;
        it.innerHTML = '<b><span class="' + (p.cat === 'kook' ? 'sq' : 'dot') + '" style="background:' + color(p) + ';margin-right:6px"></span>' + p.name + '</b><small>' +
          (p.kind === '행복주택' ? p.m2 + '㎡ ' + p.py + ' · 공가 ' + p.vac + ' · ' + p.dep + ' · 월 ' + p.rent + ' · ' + p.rank : p.rank) + '</small>';
        it.addEventListener('click', function(){ map.setZoom(15, true); map.panTo(mk.getPosition()); infow.setContent(iwHtml(p, approx)); infow.open(map, mk); });
        list.appendChild(it);
      }
      done++; status.textContent = done + ' / ' + PLACES.length + ' 좌표 변환 중…';
      setTimeout(next, cache[p.addr] ? 0 : 80);
    });
  }
  next();

  // 필터
  function applyFilter(){
    var on = {}; document.querySelectorAll('header input[data-cat]').forEach(function(c){ on[c.dataset.cat] = c.checked; });
    markers.forEach(function(mk){ mk.setMap(on[mk.__p.cat] ? map : null); });
    document.querySelectorAll('#list .it').forEach(function(it){ it.style.display = on[it.dataset.cat] ? '' : 'none'; });
  }
  document.querySelectorAll('header input[data-cat]').forEach(function(c){ c.addEventListener('change', applyFilter); });
  var obs = new MutationObserver(applyFilter); obs.observe(list, { childList: true });
  naver.maps.Event.addListener(map, 'click', function(){ infow.close(); });
}
</script>
